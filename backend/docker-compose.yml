# Start everything with:  docker compose up --build
# Then open the app at http://localhost:8080 (Swagger: http://localhost:8000/docs)
#
# Copy .env.example to .env first. Docker Compose reads it for every service.

services:
  # The Angular app, served by nginx, which also passes /api/... on to the api service.
  web:
    build: ../frontend
    ports:
      # Set WEB_HOST_PORT in .env if 8080 is taken.
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy # the API's Dockerfile has a HEALTHCHECK

  api:
    build: .
    env_file: .env
    environment:
      # Inside Docker the database is the "db" service, not localhost.
      # Docker always uses psycopg; pg8000 is only a Windows-laptop workaround.
      # The API runs as leavedesk_app (rows only); Alembic as leavedesk_migrator.
      LEAVEDESK_DATABASE_URL: postgresql+psycopg://leavedesk_app:${LEAVEDESK_APP_DB_PASSWORD}@db:5432/leavedesk
      LEAVEDESK_MIGRATION_DATABASE_URL: postgresql+psycopg://leavedesk_migrator:${LEAVEDESK_MIGRATOR_DB_PASSWORD}@db:5432/leavedesk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL 17. The api service applies the Alembic migrations when it starts.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leavedesk
      POSTGRES_USER: leavedesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by docker/initdb/01-roles.sh, which creates the two roles.
      LEAVEDESK_MIGRATOR_DB_PASSWORD: ${LEAVEDESK_MIGRATOR_DB_PASSWORD:?set it in .env}
      LEAVEDESK_APP_DB_PASSWORD: ${LEAVEDESK_APP_DB_PASSWORD:?set it in .env}
    ports:
      # Only this computer can connect (127.0.0.1), not the whole network.
      # Set POSTGRES_HOST_PORT in .env if 5432 is taken, for example by a
      # PostgreSQL installed directly on Windows.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume. After changing it: docker compose down -v
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leavedesk -d leavedesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

# Start everything with:  docker compose up --build
# Then open http://localhost:8000/docs
#
# Copy .env.example to .env first. Docker Compose reads it for both services.

services:
  api:
    build: .
    env_file: .env
    environment:
      # Inside Docker the database is the "db" service, not localhost.
      # Docker always uses psycopg; pg8000 is only a Windows-laptop workaround.
      LEAVEDESK_DATABASE_URL: postgresql+psycopg://leavedesk:${POSTGRES_PASSWORD}@db:5432/leavedesk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL 17. The api service applies the Alembic migrations when it starts.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leavedesk
      POSTGRES_USER: leavedesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leavedesk -d leavedesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

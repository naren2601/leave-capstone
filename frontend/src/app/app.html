<mat-toolbar role="banner">
  <span class="app-name">LeaveDesk</span>

  @if (auth.isLoggedIn()) {
    <nav aria-label="Main">
      <a mat-button routerLink="/leave" routerLinkActive="active" ariaCurrentWhenActive="page"
        >My leave</a
      >
      @if (auth.isManager()) {
        <a mat-button routerLink="/approvals" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Approvals</a
        >
      }
    </nav>
    <span class="spacer"></span>
    <!-- The bell's code (menu, badge) downloads after the first screen shows. -->
    @defer (on idle) {
      <app-notification-bell />
    } @placeholder {
      <span class="bell-placeholder"></span>
    }
    <span class="who">{{ auth.user()?.email }}</span>
    <button mat-button type="button" (click)="auth.logout()">Log out</button>
  }
</mat-toolbar>

<main class="page">
  <router-outlet />
</main>

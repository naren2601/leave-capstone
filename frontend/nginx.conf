# nginx for the LeaveDesk web app (used by the Dockerfile).
# The browser talks to one address: pages come from here, and /api/... is passed to the
# API container, the same way proxy.conf.json does for `npm start`.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Safer defaults for every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # For the Docker health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The live notification stream (Server-Sent Events). Each event must reach the
    # browser at once, so nothing may be buffered, and the line stays open for long.
    # (The API also sends "X-Accel-Buffering: no"; this keeps it safe even without that.)
    location = /api/notifications/stream {
        proxy_pass http://api:8000/notifications/stream$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # The URL carries the access token (?access_token=...), so keep it out of the log.
        access_log off;
    }

    # Every other API call. The trailing "/" removes the /api prefix:
    # /api/leave-requests -> http://api:8000/leave-requests
    location ^~ /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files with a hash in the name (main-2CV5BP4V.js) never change: cache a year.
    location ~* "-[A-Za-z0-9]{8}\.(js|css)$" {
        expires 1y;
        try_files $uri =404;
    }

    # Angular routes (/leave, /approvals, ...) are not files: answer with index.html and
    # let the Angular router show the page. index.html itself is never cached, so a new
    # release is picked up on the next visit.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
